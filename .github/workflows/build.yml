name: Build SARVA-SHIELD v5 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: 4. Auto-Structure Project & Generate Android Files
        run: |
          # Find and backup pubspec.yaml and main.dart regardless of where they were dropped
          cp pubspec.yaml /tmp/pubspec.yaml
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart /tmp/main.dart
          else
            FOUND_MAIN=$(find . -name "main.dart" | head -n 1)
            cp "$FOUND_MAIN" /tmp/main.dart
          fi

          # Generate complete Flutter Android project skeleton
          flutter create --org com.tml.sarvashield --project-name sarva_shield_app --platforms android .

          # Restore our custom SARVA-SHIELD v5 files
          mkdir -p lib
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart

      - name: 5. Download Flutter Packages
        run: flutter pub get

      - name: 6. Inject Hardware Permissions & Fix Android Gradle
        run: |
          python3 - << 'EOF'
          import os, glob, re

          # 1. Write complete AndroidManifest.xml with Bluetooth, GPS, Indoor Network & SMS Permissions
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          manifest_content = """<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.VIBRATE"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="sms" />
                  </intent>
              </queries>

              <application
                  android:label="SARVA-SHIELD v5"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          """
          with open(manifest_path, "w") as f:
              f.write(manifest_content)

          # 2. Update android/app/build.gradle for SDK 34 & minSdkVersion 21
          app_gradle = "android/app/build.gradle"
          with open(app_gradle, "r") as f:
              content = f.read()
          content = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 34", content)
          content = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 21", content)
          content = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 34", content)
          with open(app_gradle, "w") as f:
              f.write(content)

          # 3. Patch flutter_bluetooth_serial plugin for Android SDK 34 & Namespace compatibility
          bt_gradles = glob.glob(os.path.expanduser("~/.pub-cache/hosted/pub.dev/flutter_bluetooth_serial-*/android/build.gradle"))
          for bg in bt_gradles:
              with open(bg, "r") as f:
                  bcontent = f.read()
              bcontent = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 34", bcontent)
              if "namespace" not in bcontent:
                  bcontent = bcontent.replace("android {", "android {\n    namespace 'io.github.edufolly.flutterbluetoothserial'")
              with open(bg, "w") as f:
                  f.write(bcontent)
          EOF

      - name: 7. Compile Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk SARVA-SHIELD-v5.apk

      - name: 8. Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: SARVA-SHIELD-v5-APK
          path: SARVA-SHIELD-v5.apk
