name: Build SARVA-SHIELD APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Locate Code, Generate Android Skeleton & Fix Permissions
        id: prepare
        run: |
          # 1. Locate pubspec.yaml and lib folder wherever they are
          PUB_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          APP_DIR=$(dirname "$PUB_PATH")
          echo "Found Flutter project in: $APP_DIR"
          echo "app_dir=$APP_DIR" >> $GITHUB_OUTPUT

          cd "$APP_DIR"

          # 2. Backup main.dart and pubspec.yaml
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/
          cp -r lib /tmp/backup/

          # 3. Generate fresh Android folder if missing or broken
          flutter create --platforms=android --org com.tml.sarvashield .

          # 4. Restore original code
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/backup/lib lib

          # 5. Inject Android 12+ Bluetooth, Location & SMS Permissions into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \
          <uses-permission android:name="android.permission.INTERNET" />\
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
          <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\
          <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\
          <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
          <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\
          <uses-permission android:name="android.permission.CALL_PHONE" />' "$MANIFEST"

          # 6. Fetch packages
          flutter pub get

      - name: Patch flutter_bluetooth_serial Namespace (AGP 8+ Fix)
        run: |
          find / -name "build.gradle" 2>/dev/null | grep "flutter_bluetooth_serial" | while read -r file; do
            echo "Patching namespace in $file"
            sed -i "/android {/a \    namespace 'io.github.edufolly.flutterbluetoothserial'" "$file"
            sed -i "s/compileSdkVersion .*/compileSdkVersion 34/g" "$file"
          done

      - name: Build Release APK
        working-directory: ${{ steps.prepare.outputs.app_dir }}
        run: flutter build apk --release

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: SARVA-SHIELD-v5-APK
          path: ${{ steps.prepare.outputs.app_dir }}/build/app/outputs/flutter-apk/app-release.apk
